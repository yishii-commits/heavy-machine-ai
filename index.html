<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>現場用AI検知システム</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; position: relative; width: 100vw; height: 100vh; }
    /* ビデオを画面いっぱいに広げる（アスペクト比維持） */
    #video { width: 100%; height: 100%; object-fit: cover; }
    /* キャンバスをビデオに完全に重ねる */
    #canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // カメラ起動（背面カメラ優先）
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    }).then(stream => {
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        // 重要：表示サイズではなく、ビデオ本来の解像度をキャンバスにセット
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        loadModel();
      };
    });

    async function loadModel() {
      const model = await cocoSsd.load();
      detect(model);
    }

    async function detect(model) {
      const predictions = await model.detect(video);
      
      // 描画をクリア
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      predictions.forEach(p => {
        if(p.class === 'person') {
          const [x, y, width, height] = p.bbox;
          
          // 枠を描画（ビデオの生データに対して描くのでズレない）
          ctx.strokeStyle = '#00FF00';
          ctx.lineWidth = 15; // 現場で見やすい極太枠
          ctx.strokeRect(x, y, width, height);
          
          // 文字を描画
          ctx.fillStyle = '#00FF00';
          ctx.font = 'bold 50px sans-serif';
          ctx.fillText(`警告: 人! (${Math.round(p.score * 100)}%)`, x, y > 60 ? y - 20 : 70);
        }
      });
      requestAnimationFrame(() => detect(model));
    }
  </script>
</body>
</html>
