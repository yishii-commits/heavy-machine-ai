<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>重機安全監視システム - デモ版</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow: hidden; }
        #video-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        
        /* 警告枠のエフェクト */
        #alert-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; border: 0px solid red; box-sizing: border-box; }
        .danger-border { border: 20px solid red !important; animation: blink 0.5s infinite; }
        .warning-border { border: 20px solid yellow !important; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        /* スタート画面 */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        #startBtn { padding: 25px 50px; font-size: 28px; background: #ff4444; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }

        /* 設定パネル (右1/3) */
        #gearBtn { position: fixed; top: 15px; right: 15px; z-index: 2000; font-size: 35px; background: none; border: none; color: white; cursor: pointer; text-shadow: 0 0 5px #000; }
        #sidePanel { position: fixed; top: 0; right: 0; width: 33%; height: 100%; background: rgba(0,0,0,0.85); color: white; padding: 20px; z-index: 1900; display: none; box-sizing: border-box; border-left: 2px solid #555; }
        .set-group { margin-top: 40px; text-align: center; }
        .set-btn { width: 100%; padding: 20px 10px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 8px; }
        #closePanel { position: absolute; bottom: 30px; left: 20px; right: 20px; padding: 15px; background: #555; color: white; border: none; border-radius: 8px; }
        
        /* ステータス表示 */
        #info { position: fixed; top: 15px; left: 15px; color: #0f0; z-index: 500; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="overlay">
    <h1 style="margin-bottom:30px;">重機周囲監視システム</h1>
    <button id="startBtn">監視を開始する</button>
    <p style="margin-top:20px; color:#aaa;">※ボタンを押すとアラート音が有効になります</p>
</div>

<div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="alert-frame"></div>
</div>

<div id="info">システム待機中...</div>

<button id="gearBtn">⚙️</button>

<div id="sidePanel">
    <h2 style="text-align:center; margin-bottom:10px;">距離調整</h2>
    <hr>
    
    <div class="set-group">
        <p style="color:#ff4444; font-weight:bold;">🔴 危険 (至近距離)</p>
        <button id="setRedBtn" class="set-btn" style="background:#ff4444; color:white;">2mに立ってセット</button>
        <p>設定値: <span id="redVal">450</span> px</p>
    </div>

    <div class="set-group">
        <p style="color:#ffeb3b; font-weight:bold;">🟡 注意 (中間距離)</p>
        <button id="setYellowBtn" class="set-btn" style="background:#ffeb3b; color:black;">5mに立ってセット</button>
        <p>設定値: <span id="yellowVal">250</span> px</p>
    </div>

    <button id="closePanel">設定を閉じる</button>
</div>

<script>
    let model;
    let video = document.getElementById('webcam');
    let canvas = document.getElementById('canvas');
    let ctx = canvas.getContext('2d');
    let alertFrame = document.getElementById('alert-frame');
    let lastPredictions = [];
    
    // 設定値
    let DIST_RED = 450;
    let DIST_YELLOW = 250;
    let isMonitoring = false;

    // オーディオ設定 (Beep音の生成)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration) {
        if (!isMonitoring) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        gain.gain.value = 0.1;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        setTimeout(() => osc.stop(), duration);
    }

    // カメラ起動
    async function setupCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }, // 外カメラ優先
            audio: false
        });
        video.srcObject = stream;
        return new Promise((resolve) => {
            video.onloadedmetadata = () => resolve(video);
        });
    }

    // 物体検知ループ
    async function detect() {
        const predictions = await model.detect(video);
        lastPredictions = predictions;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let maxStatus = "safe"; // safe, warning, danger

        predictions.forEach(p => {
            if (p.class === 'person') {
                const x = p.bbox[0];
                const y = p.bbox[1];
                const w = p.bbox[2];
                const h = p.bbox[3];
                const size = Math.max(w, h); // 縦か横の長い方を基準にする

                let color = "#00FF00"; // デフォルト緑
                if (size >= DIST_RED) {
                    color = "#FF0000";
                    maxStatus = "danger";
                } else if (size >= DIST_YELLOW) {
                    color = "#FFFF00";
                    if (maxStatus !== "danger") maxStatus = "warning";
                }

                // 運用では消してもいいが、デモ用に薄く枠を表示
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.strokeRect(x, y, w, h);
            }
        });

        updateAlert(maxStatus);
        requestAnimationFrame(detect);
    }

    // アラート演出
    let lastAlertTime = 0;
    function updateAlert(status) {
        const now = Date.now();
        alertFrame.className = "";
        
        if (status === "danger") {
            alertFrame.classList.add("danger-border");
            if (now - lastAlertTime > 200) {
                playBeep(880, 100); // 高い音
                if (navigator.vibrate) navigator.vibrate(200);
                lastAlertTime = now;
            }
            document.getElementById('info').innerText = "⚠️ 危険：至近距離に人！";
            document.getElementById('info').style.color = "red";
        } else if (status === "warning") {
            alertFrame.classList.add("warning-border");
            if (now - lastAlertTime > 600) {
                playBeep(440, 200); // 低い音
                lastAlertTime = now;
            }
            document.getElementById('info').innerText = "⚡ 注意：接近";
            document.getElementById('info').style.color = "yellow";
        } else {
            document.getElementById('info').innerText = "✅ 監視中：異常なし";
            document.getElementById('info').style.color = "lime";
        }
    }

    // 設定キャプチャロジック
    function captureSize(target) {
        const persons = lastPredictions.filter(p => p.class === 'person');
        if (persons.length === 0) {
            alert("人が検知されていません。カメラの前に立ってください。");
            return;
        }
        const maxSize = Math.max(...persons.map(p => Math.max(p.bbox[2], p.bbox[3])));
        
        if (target === 'red') {
            DIST_RED = maxSize;
            document.getElementById('redVal').innerText = Math.round(maxSize);
        } else {
            DIST_YELLOW = maxSize;
            document.getElementById('yellowVal').innerText = Math.round(maxSize);
        }
    }

    // イベントリスナー
    document.getElementById('startBtn').onclick = async () => {
        document.getElementById('overlay').style.display = 'none';
        isMonitoring = true;
        document.getElementById('info').innerText = "モデル読み込み中...";
        model = await cocoSsd.load();
        await setupCamera();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        detect();
    };

    document.getElementById('gearBtn').onclick = () => {
        const panel = document.getElementById('sidePanel');
        panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
    };

    document.getElementById('closePanel').onclick = () => {
        document.getElementById('sidePanel').style.display = 'none';
    };

    document.getElementById('setRedBtn').onclick = () => captureSize('red');
    document.getElementById('setYellowBtn').onclick = () => captureSize('yellow');

    // 画面消灯防止のハック (小さな動画を再生し続ける)
    // 現場ではスマホの設定で「画面消灯なし」にするのが確実です
</script>
</body>
</html>
