<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>重機安全AIデモ_バイブ搭載版</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; position: relative; width: 100vw; height: 100vh; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    #canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
    #status {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.7); color: #fff; padding: 8px 12px;
      font-family: sans-serif; font-size: 16px; font-weight: bold; border-radius: 4px; z-index: 100;
    }
  </style>
</head>
<body>
  <div id="status">AI準備中...画面を1回タップして開始</div>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');

    const DIST_NEAR = 450;  // 赤：バイブ発動
    const DIST_MID  = 250;  // 黄：注意

    // バイブの連打を防ぐためのフラグ
    let lastVibrateTime = 0;

    // 画面タップでバイブと音声の権限を有効化（ブラウザの仕様対策）
    window.addEventListener('click', () => {
        if (navigator.vibrate) {
            navigator.vibrate(100); // 軽くテスト振動
            statusDiv.innerText = "バイブ有効化完了";
        }
    });

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    }).then(stream => {
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        loadModel();
      };
    });

    async function loadModel() {
      statusDiv.innerText = "モデル読み込み中...";
      const model = await cocoSsd.load();
      statusDiv.innerText = "監視中...";
      detect(model);
    }

    async function detect(model) {
      const predictions = await model.detect(video, 20, 0.3);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      let dangerFound = false;

      predictions.forEach(p => {
        if(p.class === 'person') {
          const [x, y, width, height] = p.bbox;
          const score = Math.round(p.score * 100);
          
          let color = '#00FF00';
          let msg = '安全';

          if (height > DIST_NEAR) {
            color = '#FF0000';
            msg = '危険！';
            dangerFound = true; // 危険フラグを立てる
          } else if (height > DIST_MID) {
            color = '#FFFF00';
            msg = '注意';
          }

          ctx.strokeStyle = color;
          ctx.lineWidth = 15;
          ctx.strokeRect(x, y, width, height);
          
          ctx.fillStyle = color;
          ctx.font = 'bold 45px sans-serif';
          ctx.fillText(`${msg} (${score}%)`, x, y > 60 ? y - 20 : 60);
          
          statusDiv.style.color = color;
          statusDiv.innerText = `状況: ${msg}`;
        }
      });

      // --- バイブレーション実行 ---
      if (dangerFound && navigator.vibrate) {
        const now = Date.now();
        // 0.5秒間隔で「ブブッ、ブブッ」と震わせる
        if (now - lastVibrateTime > 500) {
          navigator.vibrate([200, 100, 200]); 
          lastVibrateTime = now;
        }
      }

      if (predictions.filter(p => p.class === 'person').length === 0) {
        statusDiv.style.color = '#fff';
        statusDiv.innerText = "監視中（ターゲットなし）";
      }

      requestAnimationFrame(() => detect(model));
    }
  </script>
</body>
</html>
