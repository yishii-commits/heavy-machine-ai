<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>重機安全監視システム - デモ版（修正版）</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow: hidden; }
        #video-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        
        #alert-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; border: 0px solid red; box-sizing: border-box; }
        .danger-border { border: 20px solid red !important; animation: blink 0.5s infinite; }
        .warning-border { border: 20px solid yellow !important; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        #startBtn { padding: 25px 50px; font-size: 28px; background: #ff4444; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }

        #gearBtn { position: fixed; top: 15px; right: 15px; z-index: 2000; font-size: 35px; background: none; border: none; color: white; cursor: pointer; text-shadow: 0 0 5px #000; }
        #sidePanel { position: fixed; top: 0; right: 0; width: 33%; height: 100%; background: rgba(0,0,0,0.85); color: white; padding: 20px; z-index: 1900; display: none; box-sizing: border-box; border-left: 2px solid #555; overflow-y: auto; }
        .set-group { margin-top: 30px; text-align: center; }
        .set-btn { width: 100%; padding: 20px 10px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 8px; }
        #closePanel { width: 100%; margin-top: 40px; padding: 15px; background: #555; color: white; border: none; border-radius: 8px; }
        
        #info { position: fixed; top: 15px; left: 15px; color: #0f0; z-index: 500; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 15px; border-radius: 5px; font-size: 18px; }
        
        /* エラー表示用の通知スタイルを追加 */
        #panel-notice { color: #ff4444; font-weight: bold; margin-top: 10px; text-align: center; min-height: 24px; }
    </style>
</head>
<body>

<div id="overlay">
    <h1 style="margin-bottom:30px;">重機周囲監視システム</h1>
    <button id="startBtn">監視を開始する</button>
    <p style="margin-top:20px; color:#aaa;">※AI読み込みに数秒かかります</p>
</div>

<div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="alert-frame"></div>
</div>

<div id="info">システム待機中...</div>

<button id="gearBtn">⚙️</button>

<div id="sidePanel">
    <h2 style="text-align:center; margin-bottom:10px;">距離調整</h2>
    <div id="panel-notice"></div>
    <hr>
    
    <div class="set-group">
        <p style="color:#ff4444; font-weight:bold;">🔴 危険 (至近距離)</p>
        <button id="setRedBtn" class="set-btn" style="background:#ff4444; color:white;">カメラの前に立ち<br>2m設定で保存</button>
        <p>設定値(横幅): <span id="redVal">150</span> px</p>
    </div>

    <div class="set-group">
        <p style="color:#ffeb3b; font-weight:bold;">🟡 注意 (中間距離)</p>
        <button id="setYellowBtn" class="set-btn" style="background:#ffeb3b; color:black;">カメラの前に立ち<br>5m設定で保存</button>
        <p>設定値(横幅): <span id="yellowVal">80</span> px</p>
    </div>

    <button id="closePanel">設定を閉じる</button>
</div>

<script>
    let model;
    let video = document.getElementById('webcam');
    let canvas = document.getElementById('canvas');
    let ctx = canvas.getContext('2d', { alpha: true });
    let alertFrame = document.getElementById('alert-frame');
    let panelNotice = document.getElementById('panel-notice');
    let lastPredictions = [];
    
    // 横幅基準（w）に変更したため、初期値を現実的なピクセル数（1280x720想定）に調整したわ
    let DIST_RED = 150;
    let DIST_YELLOW = 80;
    let isMonitoring = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq, duration) {
        if (!isMonitoring || audioCtx.state === 'suspended') return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "square";
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration/1000);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration/1000);
        } catch(e) { console.error("Audio error", e); }
    }

    async function setupCamera() {
        const constraints = {
            video: { 
                facingMode: "environment",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        return new Promise((resolve) => {
            video.onloadedmetadata = () => {
                video.play();
                resolve(video);
            };
        });
    }

    async function detect() {
        if (!isMonitoring) return;

        try {
            const predictions = await model.detect(video, 3, 0.4);
            lastPredictions = predictions;
            
            if (canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let maxStatus = "safe";

            for (let i = 0; i < predictions.length; i++) {
                const p = predictions[i];
                if (p.class === 'person') {
                    const [x, y, w, h] = p.bbox;
                    
                    // 【修正点】姿勢の影響を受けにくい「横幅（w）」を基準にするわ
                    const size = w; 

                    let color = "#00FF00";
                    if (size >= DIST_RED) {
                        color = "#FF0000";
                        maxStatus = "danger";
                    } else if (size >= DIST_YELLOW) {
                        color = "#FFFF00";
                        if (maxStatus !== "danger") maxStatus = "warning";
                    }

                    ctx.strokeStyle = color;
                    ctx.lineWidth = 6;
                    ctx.strokeRect(x, y, w, h);
                }
            }
            updateAlert(maxStatus);
        } catch (err) {
            console.error("Detect Loop Error:", err);
            // 🔴 ここでのリロードやループ停止を排除し、エラーが起きても次のフレーム処理を維持するわ
        }
        requestAnimationFrame(detect);
    }

    let lastAlertTime = 0;
    function updateAlert(status) {
        const now = Date.now();
        alertFrame.className = "";
        
        const infoEl = document.getElementById('info');
        if (status === "danger") {
            alertFrame.classList.add("danger-border");
            if (now - lastAlertTime > 250) {
                playBeep(880, 150);
                if (navigator.vibrate) navigator.vibrate(200);
                lastAlertTime = now;
            }
            infoEl.innerText = "⚠️ 危険：至近距離！";
            infoEl.style.color = "red";
        } else if (status === "warning") {
            alertFrame.classList.add("warning-border");
            if (now - lastAlertTime > 700) {
                playBeep(440, 300);
                lastAlertTime = now;
            }
            infoEl.innerText = "⚡ 注意：接近中";
            infoEl.style.color = "yellow";
        } else {
            infoEl.innerText = "✅ 監視中：異常なし";
            infoEl.style.color = "lime";
        }
    }

    // 画面を止めずにサイドパネル内に警告を表示する関数
    function showNotice(msg) {
        panelNotice.innerText = msg;
        setTimeout(() => {
            if (panelNotice.innerText === msg) panelNotice.innerText = "";
        }, 4000); // 4秒後に自動消去
    }

    function captureSize(target) {
        // 【修正点】alert()を廃止して、画面がフリーズするのを防ぐわ
        if (!lastPredictions || lastPredictions.length === 0) {
            showNotice("❌ 検知データがありません。");
            return;
        }
        const persons = lastPredictions.filter(p => p.class === 'person');
        if (persons.length === 0) {
            showNotice("❌ 人物が検知されていません。");
            return;
        }
        
        // ここでも「横幅（bbox[2]）」を取得するように変更しているわ
        const maxWidth = Math.max(...persons.map(p => p.bbox[2]));
        
        if (target === 'red') {
            // 大小関係の論理チェックも追加したわよ
            if (maxWidth <= DIST_YELLOW) {
                showNotice("⚠️ 危険(2m)の値は注意(5m)より大きくしてください");
                return;
            }
            DIST_RED = maxWidth;
            document.getElementById('redVal').innerText = Math.round(maxWidth);
            showNotice("🔴 危険距離を設定しました");
        } else {
            if (maxWidth >= DIST_RED) {
                showNotice("⚠️ 注意(5m)の値は危険(2m)より小さくしてください");
                return;
            }
            DIST_YELLOW = maxWidth;
            document.getElementById('yellowVal').innerText = Math.round(maxWidth);
            showNotice("🟡 注意距離を設定しました");
        }
        console.log(`Updated ${target} to ${maxWidth}px (Width-based)`);
    }

    document.getElementById('startBtn').onclick = async () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('info').innerText = "AIモデル読込中...";
        document.getElementById('startBtn').innerText = "読み込み中...";
        document.getElementById('startBtn').disabled = true;

        try {
            model = await cocoSsd.load();
            await setupCamera();
            document.getElementById('overlay').style.display = 'none';
            isMonitoring = true;
            detect();
        } catch (e) {
            alert("カメラまたはAIの初期化エラー: " + e.message);
            location.reload();
        }
    };

    document.getElementById('gearBtn').onclick = () => {
        const panel = document.getElementById('sidePanel');
        panel.style.display = (panel.style.display === 'none' || panel.style.display === '') ? 'block' : 'none';
        panelNotice.innerText = ""; // パネルを開いたときはメッセージをクリア
    };

    document.getElementById('closePanel').onclick = () => {
        document.getElementById('sidePanel').style.display = 'none';
    };

    document.getElementById('setRedBtn').onclick = () => captureSize('red');
    document.getElementById('setYellowBtn').onclick = () => captureSize('yellow');

</script>
</body>
</html>
