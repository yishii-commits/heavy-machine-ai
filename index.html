<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>重機安全AIデモ_距離判定版</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; position: relative; width: 100vw; height: 100vh; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    #canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
    #status {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.7); color: #fff; padding: 8px 12px;
      font-family: sans-serif; font-size: 16px; font-weight: bold; border-radius: 4px; z-index: 100;
    }
  </style>
</head>
<body>
  <div id="status">AI準備中...</div>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');

    // --- デモ用：距離判定のしきい値（ピクセル高さ） ---
    const DIST_NEAR = 450;  // これより大きいと「赤（危険）」
    const DIST_MID  = 250;  // これより大きいと「黄（注意）」、小さいと「緑（安全）」

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    }).then(stream => {
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        loadModel();
      };
    });

    async function loadModel() {
      statusDiv.innerText = "モデル読み込み中...";
      const model = await cocoSsd.load();
      statusDiv.innerText = "監視中...";
      detect(model);
    }

    async function detect(model) {
      // 安定して出ている 0.3 の感度を維持
      const predictions = await model.detect(video, 20, 0.3);
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      let detectedCount = 0;

      predictions.forEach(p => {
        if(p.class === 'person') {
          detectedCount++;
          const [x, y, width, height] = p.bbox;
          const score = Math.round(p.score * 100);
          
          // --- 距離による判定ロジック ---
          let color = '#00FF00'; // 緑（遠い）
          let msg = '安全';

          if (height > DIST_NEAR) {
            color = '#FF0000'; // 赤（近い）
            msg = '危険！';
          } else if (height > DIST_MID) {
            color = '#FFFF00'; // 黄（中間）
            msg = '注意';
          }

          // 枠を描画
          ctx.strokeStyle = color;
          ctx.lineWidth = 15;
          ctx.strokeRect(x, y, width, height);
          
          // 文字を描画（背景をつけて読みやすく）
          ctx.fillStyle = color;
          ctx.font = 'bold 45px sans-serif';
          const label = `${msg} (${score}%)`;
          ctx.fillText(label, x, y > 60 ? y - 20 : 60);

          // ステータス表示を更新
          statusDiv.style.color = color;
          statusDiv.innerText = `状況: ${msg}`;
        }
      });

      if (detectedCount === 0) {
        statusDiv.style.color = '#fff';
        statusDiv.innerText = "監視中（ターゲットなし）";
      }

      requestAnimationFrame(() => detect(model));
    }
  </script>
</body>
</html>
